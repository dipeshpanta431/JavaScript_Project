<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Background Changer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #212121;
        color: #fff;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 20px;
        transition: background-color 0.3s ease;
    }

    #box {
        width: 100%;
        max-width: 700px;

        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;

        gap: 25px;
        margin-bottom: 35px;
    }

    .button {
        width: 100px;
        height: 100px;

        border: 4px solid black;
        border-radius: 12px;

        display: block;
        cursor: pointer;

        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
        transform: scale(1.08);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    h2 {
        text-align: center;
        font-family: 'Courier New', Courier, monospace;

        font-size: clamp(18px, 3vw, 28px);

        max-width: 800px;
        line-height: 1.5;

        margin: 0;
    }


    /* Tablet */
    @media (max-width: 768px) {

        #box {
            gap: 20px;
        }

        .button {
            width: 85px;
            height: 85px;
        }

        h2 {
            font-size: 21px;
        }
    }


    /* Mobile */
    @media (max-width: 480px) {

        body {
            padding: 15px;
        }

        #box {
            gap: 15px;
            margin-bottom: 25px;
        }

        .button {
            width: 65px;
            height: 65px;
            border-width: 3px;
        }

        h2 {
            font-size: 17px;
            line-height: 1.4;
        }
    }


    /* Very small mobile */
    @media (max-width: 350px) {

        .button {
            width: 55px;
            height: 55px;
        }

        #box {
            gap: 10px;
        }

        h2 {
            font-size: 15px;
        }
    }
</style>


</head>

<body>
<div id="box">

    <span class="button" id="grey"
          style="background-color: grey;"></span>

    <span class="button" id="red"
          style="background-color: red;"></span>

    <span class="button" id="rgb(34, 47, 24)"
          style="background-color: rgb(34, 47, 24);"></span>

    <span class="button" id="purple"
          style="background-color: purple;"></span>

</div>

<h2>
    Click on one of the colours to change
    background-color of the page!
</h2>


<script>

    const body = document.querySelector('body');
    const buttons = document.querySelectorAll('.button');

    buttons.forEach(function (button) {

        button.addEventListener('click', function (e) {

            switch (e.target.id) {

                case 'grey':
                    body.style.backgroundColor = 'grey';
                    break;

                case 'red':
                    body.style.backgroundColor = 'red';
                    break;

                case 'rgb(34, 47, 24)':
                    body.style.backgroundColor = "rgb(34, 47, 24)";
                    break;

                case 'purple':
                    body.style.backgroundColor = 'purple';
                    break;

                default:
                    body.style.backgroundColor = '#212121';
            }

        });

    });

</script>


</body>

</html>
