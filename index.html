
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050510">

<title>Neon Snake</title>

<style>

/* =========================================================
   NEON SNAKE
   SINGLE FILE VERSION
   ========================================================= */

:root {
    --bg: #050510;
    --panel: rgba(10, 15, 30, .85);

    --cyan: #00f7ff;
    --green: #39ff88;
    --purple: #a855ff;
    --pink: #ff3cac;

    --text: #f4f7ff;
    --muted: #78829b;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {
    min-height: 100vh;

    overflow-x: hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,247,255,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(168,85,255,.10),
            transparent 30%
        ),
        var(--bg);

    display: flex;
    justify-content: center;

    padding: 25px 15px;
}


/* =========================================================
   BACKGROUND EFFECTS
   ========================================================= */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -1;
}


.orb {
    position: absolute;

    width: clamp(180px, 28vw, 400px);

    aspect-ratio: 1;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .13;

    animation:
        floatingOrb
        10s ease-in-out infinite alternate;
}


.orb.one {
    background: var(--cyan);

    top: -15%;
    left: -10%;
}


.orb.two {
    background: var(--purple);

    right: -10%;
    bottom: -15%;

    animation-delay: -4s;
}


.orb.three {
    background: var(--pink);

    width: 180px;

    top: 45%;
    left: 45%;

    opacity: .06;

    animation-delay: -7s;
}


.stars {
    position: absolute;

    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.35) 1px,
            transparent 1px
        );

    background-size: 70px 70px;

    opacity: .07;
}


@keyframes floatingOrb {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(40px,-30px)
            scale(1.12);
    }
}


/* =========================================================
   MAIN
   ========================================================= */

.game-container {
    width: min(850px, 100%);
}


/* =========================================================
   HEADER
   ========================================================= */

.game-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 20px;
}


.brand {
    display: flex;

    align-items: center;

    gap: 13px;
}


.snake-icon {
    width: 56px;
    height: 56px;

    display: grid;

    place-items: center;

    border-radius: 16px;

    background:
        rgba(0,247,255,.07);

    border:
        1px solid
        rgba(0,247,255,.35);

    box-shadow:
        0 0 8px rgba(0,247,255,.7),
        0 0 25px rgba(0,247,255,.2);

    font-size: 29px;
}


h1 {
    font-size:
        clamp(25px, 5vw, 40px);

    line-height: 1;

    letter-spacing: 4px;

    font-weight: 900;
}


h1 span {
    color: var(--cyan);

    text-shadow:
        0 0 5px var(--cyan),
        0 0 20px var(--cyan);
}


.brand p {
    color: var(--muted);

    font-size: 9px;

    letter-spacing: 3px;

    margin-top: 7px;
}


/* =========================================================
   SCORE
   ========================================================= */

.stats {
    display: flex;

    gap: 10px;
}


.stat-card {
    min-width: 125px;

    padding: 11px 17px;

    border-radius: 14px;

    background:
        var(--panel);

    border:
        1px solid
        rgba(0,247,255,.18);

    backdrop-filter: blur(12px);

    text-align: center;
}


.stat-label {
    display: block;

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 2px;

    margin-bottom: 4px;
}


.stat-card strong {
    font-size: 26px;

    color: var(--cyan);

    text-shadow:
        0 0 5px var(--cyan),
        0 0 15px rgba(0,247,255,.5);
}


.high-score strong {
    color: var(--green);

    text-shadow:
        0 0 5px var(--green),
        0 0 15px rgba(57,255,136,.5);
}


.score-pop {
    animation:
        scorePop
        .3s ease;
}


@keyframes scorePop {

    50% {
        transform: scale(1.2);
    }
}


/* =========================================================
   GAME AREA
   ========================================================= */

.game-area {
    width: 100%;
}


/* =========================================================
   BOARD
   ========================================================= */

.board-wrapper {
    position: relative;

    width:
        min(
            78vh,
            700px,
            100%
        );

    aspect-ratio: 1;

    margin: auto;

    padding: 5px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(0,247,255,.55),
            rgba(168,85,255,.4),
            rgba(255,60,172,.4),
            rgba(57,255,136,.4)
        );

    box-shadow:
        0 0 25px rgba(0,247,255,.15),
        0 0 70px rgba(168,85,255,.08);
}


.board-wrapper::before {

    content: "";

    position: absolute;

    inset: -3px;

    z-index: -1;

    border-radius: 24px;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--purple),
            var(--pink),
            var(--green),
            var(--cyan)
        );

    background-size: 300% 100%;

    filter: blur(5px);

    opacity: .3;

    animation:
        borderAnimation
        8s linear infinite;
}


@keyframes borderAnimation {

    to {
        background-position: 300% 0;
    }
}


canvas {

    width: 100%;
    height: 100%;

    display: block;

    border-radius: 17px;

    background: #020712;

    touch-action: none;
}


/* =========================================================
   OVERLAY
   ========================================================= */

.game-overlay {

    position: absolute;

    inset: 5px;

    border-radius: 17px;

    background:
        radial-gradient(
            circle,
            rgba(5,10,25,.5),
            rgba(2,6,18,.92)
        );

    backdrop-filter: blur(5px);

    display: grid;

    place-items: center;

    z-index: 5;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}


.game-overlay.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


.overlay-content {

    text-align: center;

    padding: 20px;
}


.overlay-icon {

    font-size:
        clamp(45px, 8vw, 75px);

    margin-bottom: 8px;

    filter:
        drop-shadow(
            0 0 8px
            var(--green)
        )
        drop-shadow(
            0 0 25px
            rgba(57,255,136,.5)
        );

    animation:
        snakeFloat
        2s ease-in-out infinite;
}


@keyframes snakeFloat {

    50% {
        transform:
            translateY(-8px)
            rotate(-3deg);
    }
}


.overlay-content h2 {

    font-size:
        clamp(28px, 6vw, 50px);

    letter-spacing: 5px;

    color: var(--cyan);

    text-shadow:
        0 0 5px var(--cyan),
        0 0 20px var(--cyan);

    margin-bottom: 8px;
}


.overlay-content p {

    color: #aab3ca;

    font-size: 13px;

    margin-bottom: 18px;
}


/* =========================================================
   DIRECTION CONTROLLER
   ========================================================= */

.mobile-controls {

    width:
        min(
            250px,
            80vw
        );

    margin:
        20px auto 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    user-select: none;
}


.middle-controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    margin: 10px 0;
}


.direction-btn {

    width:
        clamp(
            58px,
            17vw,
            72px
        );

    height:
        clamp(
            58px,
            17vw,
            72px
        );

    border-radius: 19px;

    border:
        1px solid
        rgba(0,247,255,.32);

    background:
        linear-gradient(
            145deg,
            rgba(16,27,48,.96),
            rgba(5,11,25,.96)
        );

    color: var(--cyan);

    font-size: 22px;

    cursor: pointer;

    box-shadow:
        inset 0 0 18px
        rgba(0,247,255,.04),

        0 6px 18px
        rgba(0,0,0,.35);

    transition:
        transform .1s ease,
        box-shadow .15s ease,
        border-color .15s ease;

    -webkit-tap-highlight-color:
        transparent;
}


.direction-btn:hover {

    border-color:
        rgba(0,247,255,.7);

    box-shadow:
        0 0 10px
        rgba(0,247,255,.25);
}


.direction-btn:active {

    transform:
        scale(.88);

    border-color:
        var(--cyan);

    box-shadow:
        0 0 8px var(--cyan),
        0 0 22px
        rgba(0,247,255,.5);
}


.direction-btn.center {

    color: var(--green);

    border-color:
        rgba(57,255,136,.3);

    cursor: default;
}


.direction-btn.center span {

    font-size: 12px;

    text-shadow:
        0 0 8px var(--green);
}


/* =========================================================
   START / PAUSE / RESTART
   ========================================================= */

.action-buttons {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    width: min(600px, 100%);

    margin:
        18px auto 0;
}


.neon-button {

    min-height: 48px;

    border-radius: 12px;

    background:
        rgba(10,15,30,.88);

    font-weight: 800;

    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        transform .15s ease,
        box-shadow .2s ease,
        background .2s ease;
}


.neon-button:hover {

    transform:
        translateY(-2px);
}


.neon-button:active {

    transform:
        scale(.96);
}


.primary {

    color: var(--cyan);

    border:
        1px solid
        var(--cyan);
}


.primary:hover {

    background:
        rgba(0,247,255,.08);

    box-shadow:
        0 0 8px var(--cyan),
        0 0 20px
        rgba(0,247,255,.4);
}


.secondary {

    color: #c58cff;

    border:
        1px solid
        var(--purple);
}


.secondary:hover {

    background:
        rgba(168,85,255,.08);

    box-shadow:
        0 0 12px
        rgba(168,85,255,.5);
}


.danger {

    color: #ff77ba;

    border:
        1px solid
        var(--pink);
}


.danger:hover {

    background:
        rgba(255,60,172,.08);

    box-shadow:
        0 0 12px
        rgba(255,60,172,.5);
}


.mobile-hint {

    text-align: center;

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 1.5px;

    margin-top: 10px;
}


/* =========================================================
   DESKTOP CONTROLS INFO
   ========================================================= */

.keyboard-hint {

    display: flex;

    justify-content: center;

    gap: 8px;

    margin-top: 12px;

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 1px;
}


kbd {

    min-width: 27px;

    height: 27px;

    padding: 0 7px;

    display: inline-grid;

    place-items: center;

    border-radius: 7px;

    border:
        1px solid
        rgba(0,247,255,.2);

    background: #070c19;

    color: var(--cyan);

    font-weight: 800;
}


/* =========================================================
   FOOTER
   ========================================================= */

footer {

    display: flex;

    justify-content: center;

    gap: 10px;

    color: #3d465d;

    font-size: 9px;

    letter-spacing: 2px;

    margin-top: 15px;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 700px) {

    body {
        padding:
            18px 10px 25px;
    }


    .game-header {

        flex-direction: column;

        gap: 15px;
    }


    .brand {

        justify-content: center;
    }


    .stats {

        width: 100%;

        justify-content: center;
    }


    .stat-card {

        flex: 1;

        max-width: 170px;
    }


    .board-wrapper {

        width:
            min(
                92vw,
                650px
            );
    }


    .keyboard-hint {

        display: none;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

    body {

        padding:
            12px 8px 20px;
    }


    .snake-icon {

        width: 48px;
        height: 48px;

        font-size: 25px;
    }


    h1 {

        font-size: 26px;

        letter-spacing: 3px;
    }


    .brand p {

        font-size: 8px;

        letter-spacing: 2px;
    }


    .stat-card {

        padding:
            9px 10px;

        min-width: 0;
    }


    .stat-card strong {

        font-size: 22px;
    }


    .board-wrapper {

        width: 94vw;

        padding: 4px;

        border-radius: 18px;
    }


    .game-overlay {

        inset: 4px;
    }


    .mobile-controls {

        margin-top: 18px;
    }


    .direction-btn {

        width: 62px;

        height: 62px;

        border-radius: 17px;
    }


    .action-buttons {

        grid-template-columns:
            1fr;

        gap: 8px;

        margin-top: 16px;
    }


    .neon-button {

        min-height: 50px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 350px) {

    .direction-btn {

        width: 56px;

        height: 56px;
    }


    .middle-controls {

        gap: 7px;
    }


    .mobile-controls {

        width: 210px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }
}

</style>
</head>


<body>

<main class="game-container">

<script>

/* =========================================================
   NEON SNAKE GAME
   ========================================================= */


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


const scoreElement =
    document.getElementById(
        "score"
    );

const highScoreElement =
    document.getElementById(
        "highScore"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );

const pauseBtn =
    document.getElementById(
        "pauseBtn"
    );

const restartBtn =
    document.getElementById(
        "restartBtn"
    );


const gameOverlay =
    document.getElementById(
        "gameOverlay"
    );

const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );

const overlayMessage =
    document.getElementById(
        "overlayMessage"
    );

const overlayButton =
    document.getElementById(
        "overlayButton"
    );


/* =========================================================
   CONFIG
   ========================================================= */

const GRID_SIZE = 30;

const INITIAL_SPEED = 135;

const MIN_SPEED = 55;

const SPEED_STEP = 5;

const SCORE_PER_FOOD = 10;


/* =========================================================
   GAME STATE
   ========================================================= */

let snake = [];

let food = {
    x: 0,
    y: 0
};


let direction = {
    x: 1,
    y: 0
};


let nextDirection = {
    x: 1,
    y: 0
};


let score = 0;


let highScore =
    Number(
        localStorage.getItem(
            "neonSnakeHighScore"
        )
    ) || 0;


let gameRunning = false;

let gamePaused = false;

let gameOver = false;

let gameTimer = null;


let currentSpeed =
    INITIAL_SPEED;


let canvasSize = 0;

let cellSize = 0;


/* Particles */

let particles = [];


/* Swipe */

let touchStartX = 0;

let touchStartY = 0;


/* =========================================================
   CANVAS RESIZE
   ========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const size =
        Math.floor(
            Math.min(
                rect.width,
                rect.height
            )
        );


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        size * ratio;

    canvas.height =
        size * ratio;


    canvasSize = size;

    cellSize =
        size / GRID_SIZE;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    draw();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   INITIALIZE
   ========================================================= */

function initializeGame() {

    const center =
        Math.floor(
            GRID_SIZE / 2
        );


    /*
     * More segments make the snake
     * look more natural immediately.
     */

    snake = [];

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        snake.push({
            x: center - i,
            y: center
        });
    }


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    currentSpeed =
        INITIAL_SPEED;


    gameRunning = false;

    gamePaused = false;

    gameOver = false;


    particles = [];


    createFood();

    updateUI();

    draw();
}


/* =========================================================
   START
   ========================================================= */

function startGame() {

    if (gameOver) {

        initializeGame();
    }


    if (
        gameRunning &&
        !gamePaused
    ) {
        return;
    }


    gameRunning = true;

    gamePaused = false;


    hideOverlay();


    pauseBtn.innerHTML =
        "Ⅱ PAUSE";


    startGameLoop();
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function startGameLoop() {

    clearInterval(
        gameTimer
    );


    gameTimer =
        setInterval(
            gameTick,
            currentSpeed
        );
}


function gameTick() {

    if (
        !gameRunning ||
        gamePaused ||
        gameOver
    ) {
        return;
    }


    direction = {
        ...nextDirection
    };


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL */

    if (
        head.x < 0 ||
        head.x >= GRID_SIZE ||
        head.y < 0 ||
        head.y >= GRID_SIZE
    ) {

        endGame();

        return;
    }


    /* BODY */

    const collision =
        snake.some(
            (segment, index) => {

                /*
                 * Ignore tail because
                 * it moves away.
                 */

                if (
                    index ===
                    snake.length - 1
                ) {
                    return false;
                }


                return (
                    segment.x === head.x &&
                    segment.y === head.y
                );
            }
        );


    if (collision) {

        endGame();

        return;
    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        eatFood();

    } else {

        snake.pop();
    }


    updateParticles();

    updateUI();

    draw();
}


/* =========================================================
   FOOD
   ========================================================= */

function createFood() {

    let valid = false;


    while (!valid) {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    GRID_SIZE
                ),

            y:
                Math.floor(
                    Math.random() *
                    GRID_SIZE
                )

        };


        valid =
            !snake.some(
                segment =>
                    segment.x === food.x &&
                    segment.y === food.y
            );
    }
}


function eatFood() {

    score +=
        SCORE_PER_FOOD;


    if (
        score >
        highScore
    ) {

        highScore =
            score;


        localStorage.setItem(
            "neonSnakeHighScore",
            highScore
        );
    }


    createParticles(
        food.x * cellSize +
        cellSize / 2,

        food.y * cellSize +
        cellSize / 2
    );


    createFood();


    increaseDifficulty();


    scoreElement.classList.remove(
        "score-pop"
    );


    void scoreElement.offsetWidth;


    scoreElement.classList.add(
        "score-pop"
    );


    updateUI();
}


/* =========================================================
   DIFFICULTY
   ========================================================= */

function increaseDifficulty() {

    const level =
        Math.floor(
            score / 50
        );


    currentSpeed =
        Math.max(
            MIN_SPEED,

            INITIAL_SPEED -
            level * SPEED_STEP
        );


    if (
        gameRunning &&
        !gamePaused
    ) {

        startGameLoop();
    }
}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    scoreElement.textContent =
        score;

    highScoreElement.textContent =
        highScore;
}


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause() {

    if (
        !gameRunning ||
        gameOver
    ) {
        return;
    }


    gamePaused =
        !gamePaused;


    if (gamePaused) {

        pauseBtn.innerHTML =
            "▶ RESUME";


        showOverlay(
            "PAUSED",
            "Your snake is waiting...",
            "RESUME"
        );

    } else {

        pauseBtn.innerHTML =
            "Ⅱ PAUSE";


        hideOverlay();


        startGameLoop();
    }
}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame() {

    gameRunning = false;

    gamePaused = false;

    gameOver = true;


    clearInterval(
        gameTimer
    );


    showOverlay(
        "GAME OVER",
        `Final score: ${score}`,
        "PLAY AGAIN"
    );
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    clearInterval(
        gameTimer
    );


    initializeGame();

    startGame();
}


/* =========================================================
   OVERLAY
   ========================================================= */

function showOverlay(
    title,
    message,
    buttonText
) {

    overlayTitle.textContent =
        title;

    overlayMessage.textContent =
        message;

    overlayButton.textContent =
        buttonText;


    gameOverlay.classList.remove(
        "hidden"
    );
}


function hideOverlay() {

    gameOverlay.classList.add(
        "hidden"
    );
}


/* =========================================================
   DIRECTION
   ========================================================= */

function changeDirection(
    newDirection
) {

    /*
     * Prevent reverse direction.
     */

    if (
        newDirection.x ===
            -direction.x &&

        newDirection.y ===
            -direction.y
    ) {

        return;
    }


    nextDirection =
        newDirection;
}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        const directions = {

            arrowup: {
                x: 0,
                y: -1
            },

            w: {
                x: 0,
                y: -1
            },

            arrowdown: {
                x: 0,
                y: 1
            },

            s: {
                x: 0,
                y: 1
            },

            arrowleft: {
                x: -1,
                y: 0
            },

            a: {
                x: -1,
                y: 0
            },

            arrowright: {
                x: 1,
                y: 0
            },

            d: {
                x: 1,
                y: 0
            }
        };


        if (key === " ") {

            event.preventDefault();

            togglePause();

            return;
        }


        if (
            directions[key]
        ) {

            event.preventDefault();


            if (
                !gameRunning &&
                !gameOver
            ) {

                startGame();
            }


            if (!gameOver) {

                changeDirection(
                    directions[key]
                );
            }
        }
    }
);


/* =========================================================
   BUTTONS
   ========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);


pauseBtn.addEventListener(
    "click",
    togglePause
);


restartBtn.addEventListener(
    "click",
    restartGame
);


overlayButton.addEventListener(
    "click",
    () => {

        if (gamePaused) {

            togglePause();

        } else {

            restartGame();
        }
    }
);


/* =========================================================
   MOBILE DIRECTION BUTTONS
   ========================================================= */

document
    .querySelectorAll(
        ".direction-btn[data-direction]"
    )
    .forEach(button => {

        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();


                const name =
                    button.dataset.direction;


                const directions = {

                    up: {
                        x: 0,
                        y: -1
                    },

                    down: {
                        x: 0,
                        y: 1
                    },

                    left: {
                        x: -1,
                        y: 0
                    },

                    right: {
                        x: 1,
                        y: 0
                    }
                };


                if (
                    !gameRunning &&
                    !gameOver
                ) {

                    startGame();
                }


                if (!gameOver) {

                    changeDirection(
                        directions[name]
                    );
                }
            }
        );
    });


/* =========================================================
   SWIPE CONTROLS
   ========================================================= */

canvas.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const minimum = 25;


        if (
            Math.abs(dx) < minimum &&
            Math.abs(dy) < minimum
        ) {
            return;
        }


        let newDirection;


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            newDirection =
                dx > 0

                    ? {
                        x: 1,
                        y: 0
                    }

                    : {
                        x: -1,
                        y: 0
                    };

        } else {

            newDirection =
                dy > 0

                    ? {
                        x: 0,
                        y: 1
                    }

                    : {
                        x: 0,
                        y: -1
                    };
        }


        if (
            !gameRunning &&
            !gameOver
        ) {

            startGame();
        }


        if (!gameOver) {

            changeDirection(
                newDirection
            );
        }

    },
    {
        passive: true
    }
);


/* =========================================================
   DRAW EVERYTHING
   ========================================================= */

function draw() {

    if (!canvasSize) {
        return;
    }


    drawBackground();

    drawGrid();

    drawFood();

    drawSnake();

    drawParticles();
}


/* =========================================================
   BOARD BACKGROUND
   ========================================================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(
            canvasSize * .5,
            canvasSize * .4,
            0,

            canvasSize * .5,
            canvasSize * .5,
            canvasSize * .8
        );


    gradient.addColorStop(
        0,
        "#081827"
    );


    gradient.addColorStop(
        .55,
        "#030a16"
    );


    gradient.addColorStop(
        1,
        "#02040b"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        canvasSize,
        canvasSize
    );
}


/* =========================================================
   GRID
   ========================================================= */

function drawGrid() {

    ctx.save();

    ctx.lineWidth = .5;


    for (
        let i = 0;
        i <= GRID_SIZE;
        i++
    ) {

        const position =
            i * cellSize;


        ctx.strokeStyle =
            i % 5 === 0

                ? "rgba(0,247,255,.09)"

                : "rgba(0,247,255,.025)";


        ctx.beginPath();

        ctx.moveTo(
            position,
            0
        );

        ctx.lineTo(
            position,
            canvasSize
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            position
        );

        ctx.lineTo(
            canvasSize,
            position
        );

        ctx.stroke();
    }


    ctx.restore();
}


/* =========================================================
   FOOD
   ========================================================= */

function drawFood() {

    const x =
        food.x * cellSize +
        cellSize / 2;


    const y =
        food.y * cellSize +
        cellSize / 2;


    const pulse =
        1 +
        Math.sin(
            performance.now() / 150
        ) * .1;


    ctx.save();


    ctx.shadowColor =
        "#ff3cac";

    ctx.shadowBlur =
        25;


    /*
     * Outer energy glow
     */

    ctx.fillStyle =
        "#ff3cac";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        cellSize * .28 * pulse,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Bright center
     */

    ctx.shadowBlur = 5;

    ctx.fillStyle =
        "#ffffff";


    ctx.beginPath();

    ctx.arc(
        x - cellSize * .07,
        y - cellSize * .07,
        cellSize * .075,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Energy ring
     */

    ctx.strokeStyle =
        "rgba(255,60,172,.35)";

    ctx.lineWidth = 1.5;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        cellSize * .43,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   REALISTIC / SMOOTH SNAKE
   ========================================================= */

function drawSnake() {

    if (!snake.length) {
        return;
    }


    /*
     * Draw the body as one continuous
     * smooth curved path.
     *
     * This removes the old square-block
     * appearance.
     */

    drawSmoothSnakeBody();


    /*
     * Draw body highlights.
     */

    drawSnakeHighlights();


    /*
     * Draw the head separately.
     */

    drawSnakeHead();
}


/* =========================================================
   SMOOTH SNAKE BODY
   ========================================================= */

function drawSmoothSnakeBody() {

    if (snake.length < 2) {
        return;
    }


    ctx.save();


    const points =
        snake.map(segment => ({

            x:
                segment.x *
                cellSize +
                cellSize / 2,

            y:
                segment.y *
                cellSize +
                cellSize / 2

        }));


    /*
     * Create a thick smooth path.
     */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i < points.length - 1;
        i++
    ) {

        const current =
            points[i];

        const next =
            points[i + 1];


        const midX =
            (current.x + next.x) / 2;


        const midY =
            (current.y + next.y) / 2;


        ctx.quadraticCurveTo(
            current.x,
            current.y,
            midX,
            midY
        );
    }


    const last =
        points[
            points.length - 1
        ];


    ctx.lineTo(
        last.x,
        last.y
    );


    /*
     * Thick neon outer body.
     */

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.lineWidth =
        cellSize * .68;


    ctx.shadowColor =
        "#00f7ff";

    ctx.shadowBlur =
        18;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            canvasSize,
            canvasSize
        );


    gradient.addColorStop(
        0,
        "#00f7ff"
    );


    gradient.addColorStop(
        .45,
        "#39ff88"
    );


    gradient.addColorStop(
        1,
        "#00d9ff"
    );


    ctx.strokeStyle =
        gradient;


    ctx.stroke();


    /*
     * Darker inner stripe gives the
     * snake depth and dimension.
     */

    ctx.shadowBlur = 0;

    ctx.lineWidth =
        cellSize * .42;


    const innerGradient =
        ctx.createLinearGradient(
            0,
            0,
            canvasSize,
            canvasSize
        );


    innerGradient.addColorStop(
        0,
        "#00aeb8"
    );


    innerGradient.addColorStop(
        .5,
        "#20c96d"
    );


    innerGradient.addColorStop(
        1,
        "#00a6c7"
    );


    ctx.strokeStyle =
        innerGradient;


    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   SNAKE HIGHLIGHTS
   ========================================================= */

function drawSnakeHighlights() {

    ctx.save();


    /*
     * Small glowing scales/highlights
     * along the snake body.
     */

    for (
        let i = 1;
        i < snake.length - 1;
        i += 2
    ) {

        const segment =
            snake[i];


        const x =
            segment.x *
            cellSize +
            cellSize / 2;


        const y =
            segment.y *
            cellSize +
            cellSize / 2;


        ctx.fillStyle =
            "rgba(255,255,255,.45)";


        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur = 5;


        ctx.beginPath();

        ctx.arc(
            x - cellSize * .10,
            y - cellSize * .10,
            cellSize * .045,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =========================================================
   SNAKE HEAD
   ========================================================= */

function drawSnakeHead() {

    const head =
        snake[0];


    const x =
        head.x *
        cellSize +
        cellSize / 2;


    const y =
        head.y *
        cellSize +
        cellSize / 2;


    const radius =
        cellSize * .39;


    ctx.save();


    /*
     * Head glow.
     */

    ctx.shadowColor =
        "#39ff88";

    ctx.shadowBlur =
        25;


    /*
     * Head gradient.
     */

    const gradient =
        ctx.createRadialGradient(
            x - radius * .25,
            y - radius * .25,
            radius * .1,

            x,
            y,
            radius
        );


    gradient.addColorStop(
        0,
        "#d7ffe8"
    );


    gradient.addColorStop(
        .18,
        "#75ffb0"
    );


    gradient.addColorStop(
        .65,
        "#39ff88"
    );


    gradient.addColorStop(
        1,
        "#0bd96d"
    );


    ctx.fillStyle =
        gradient;


    /*
     * Round head.
     */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Slight nose shape.
     */

    const noseX =
        x +
        direction.x *
        radius *
        .72;


    const noseY =
        y +
        direction.y *
        radius *
        .72;


    ctx.fillStyle =
        "#28f47e";


    ctx.beginPath();

    ctx.arc(
        noseX,
        noseY,
        radius * .42,
        0,
        Math.PI * 2
    );

    ctx.fill();


    drawSnakeEyes(
        x,
        y,
        radius
    );


    ctx.restore();
}


/* =========================================================
   SNAKE EYES
   ========================================================= */

function drawSnakeEyes(
    x,
    y,
    radius
) {

    ctx.save();


    /*
     * Eye positions depend on
     * snake direction.
     */

    let eye1;
    let eye2;


    if (
        direction.x === 1
    ) {

        eye1 = {
            x:
                x + radius * .40,

            y:
                y - radius * .42
        };


        eye2 = {
            x:
                x + radius * .40,

            y:
                y + radius * .42
        };

    } else if (
        direction.x === -1
    ) {

        eye1 = {
            x:
                x - radius * .40,

            y:
                y - radius * .42
        };


        eye2 = {
            x:
                x - radius * .40,

            y:
                y + radius * .42
        };

    } else if (
        direction.y === -1
    ) {

        eye1 = {
            x:
                x - radius * .42,

            y:
                y - radius * .40
        };


        eye2 = {
            x:
                x + radius * .42,

            y:
                y - radius * .40
        };

    } else {

        eye1 = {
            x:
                x - radius * .42,

            y:
                y + radius * .40
        };


        eye2 = {
            x:
                x + radius * .42,

            y:
                y + radius * .40
        };
    }


    /*
     * White eye.
     */

    [eye1, eye2].forEach(
        eye => {

            ctx.shadowColor =
                "#ffffff";

            ctx.shadowBlur = 8;

            ctx.fillStyle =
                "#ffffff";


            ctx.beginPath();

            ctx.arc(
                eye.x,
                eye.y,
                radius * .18,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Black pupil.
             */

            ctx.shadowBlur = 0;

            ctx.fillStyle =
                "#020609";


            ctx.beginPath();

            ctx.arc(
                eye.x +
                    direction.x *
                    radius * .045,

                eye.y +
                    direction.y *
                    radius * .045,

                radius * .09,

                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    ctx.restore();
}


/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            Math.random() *
            2.5 +
            .8;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random() *
                3 +
                1,

            life: 1,

            decay:
                Math.random() *
                .035 +
                .025
        });
    }
}


function updateParticles() {

    particles.forEach(
        particle => {

            particle.x +=
                particle.vx;

            particle.y +=
                particle.vy;


            particle.vx *=
                .97;

            particle.vy *=
                .97;


            particle.life -=
                particle.decay;
        }
    );


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );
}


function drawParticles() {

    ctx.save();


    particles.forEach(
        particle => {

            ctx.globalAlpha =
                particle.life;


            ctx.fillStyle =
                "#ff3cac";


            ctx.shadowColor =
                "#ff3cac";


            ctx.shadowBlur =
                12;


            ctx.beginPath();


            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );


            ctx.fill();
        }
    );


    ctx.restore();
}


/* =========================================================
   INITIALIZE
   ========================================================= */

initializeGame();


requestAnimationFrame(
    resizeCanvas
);


/* =========================================================
   IDLE ANIMATION
   ========================================================= */

function animationLoop() {

    /*
     * Keeps the food and particles
     * animated while the game is idle.
     */

    if (
        !gameRunning ||
        gamePaused
    ) {

        updateParticles();

        draw();
    }


    requestAnimationFrame(
        animationLoop
    );
}


animationLoop();

</script>
