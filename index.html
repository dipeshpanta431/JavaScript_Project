
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake Game</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --background: #05070b;
    --board: #070c12;
    --green: #39e879;
    --green-light: #8affb5;
    --green-dark: #128b48;
    --cyan: #21d9ff;
    --pink: #ff4f9a;
    --white: #f5f7fa;
    --muted: #727c8c;
}


/* =========================================================
   PAGE
========================================================= */

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(33,217,255,.07),
            transparent 35%
        ),
        var(--background);

    color: var(--white);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;

    padding:
        14px 10px 20px;

    overflow-x: hidden;
}

.game {
    width: min(720px, 100%);
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 12px;
}

.title {
    display: flex;
    align-items: center;
    gap: 9px;
}

.title-icon {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background: #0b1510;

    border:
        1px solid
        rgba(57,232,121,.3);

    font-size: 23px;
}

.title h1 {
    font-size:
        clamp(23px, 5vw, 34px);

    letter-spacing: 2px;
}


/* =========================================================
   SCORE
========================================================= */

.scores {
    display: flex;
    gap: 7px;
}

.score {
    min-width: 95px;

    padding: 7px 10px;

    text-align: center;

    background: #0a0f17;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 10px;
}

.score span {
    display: block;

    color: var(--muted);

    font-size: 8px;

    letter-spacing: 1px;

    margin-bottom: 2px;
}

.score strong {
    color: var(--green);

    font-size: 21px;
}


/* =========================================================
   GAME BOARD
========================================================= */

.board {
    position: relative;

    width: min(94vw, 620px);

    aspect-ratio: 4 / 5;

    margin: auto;

    border-radius: 16px;

    padding: 3px;

    background:
        linear-gradient(
            135deg,
            #17472c,
            #0d3340
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.55);
}

canvas {
    width: 100%;
    height: 100%;

    display: block;

    background: var(--board);

    border-radius: 13px;

    touch-action: none;
}


/* =========================================================
   GAME OVER
========================================================= */

.game-over {
    position: absolute;

    inset: 3px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(2,5,8,.94);

    border-radius: 13px;

    text-align: center;
}

.game-over.hidden {
    display: none;
}

.game-over h2 {
    color: var(--pink);

    font-size:
        clamp(28px, 8vw, 45px);

    margin-bottom: 7px;
}

.game-over p {
    color: var(--muted);

    font-size: 14px;
}

.game-over strong {
    color: var(--green);
}


/* =========================================================
   DIRECTION CONTROLS
========================================================= */

.direction-controls {
    width: 215px;

    margin:
        10px auto 0;

    display: flex;
    flex-direction: column;

    align-items: center;
}

.direction-row {
    display: flex;

    gap: 7px;

    margin:
        7px 0;
}

.direction {
    width: 60px;
    height: 52px;

    border:
        1px solid
        rgba(33,217,255,.2);

    border-radius: 12px;

    background: #090f17;

    color: var(--cyan);

    font-size: 19px;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

    user-select: none;
}

.direction:active {
    transform: scale(.9);

    border-color:
        var(--cyan);
}

.center {
    color: var(--green);

    cursor: default;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.actions {
    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 13px;
}

.action {
    width: 56px;
    height: 46px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 11px;

    background: #0a0f17;

    font-size: 20px;

    cursor: pointer;
}

.action:active {
    transform: scale(.88);
}

.start {
    color: var(--green);
}

.pause {
    color: var(--cyan);
}

.restart {
    color: var(--pink);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 650px) {

    .header {
        flex-direction: column;
    }

    .scores {
        width: 100%;

        justify-content: center;
    }

    .score {
        flex: 1;

        max-width: 150px;
    }
}

@media (max-width: 480px) {

    body {
        padding:
            9px 6px 15px;
    }

    .board {
        width: 96vw;

        aspect-ratio: 4 / 5;
    }

    .direction {
        width: 57px;
        height: 50px;
    }

    .action {
        width: 54px;
        height: 45px;
    }
}

@media (max-width: 350px) {

    .direction {
        width: 51px;
        height: 47px;
    }

    .direction-controls {
        width: 185px;
    }
}
</style>
</head>


<body>

<div class="game">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="title">

            <div class="title-icon">
                🐍
            </div>

            <h1>
                SNAKE GAME
            </h1>

        </div>


        <div class="scores">

            <div class="score">

                <span>
                    SCORE
                </span>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="score">

                <span>
                    HIGH SCORE
                </span>

                <strong id="highScore">
                    0
                </strong>

            </div>

        </div>

    </div>



    <!-- =====================================================
         GAME
    ====================================================== -->

    <div class="board">

        <canvas id="canvas"></canvas>


        <div
            id="gameOver"
            class="game-over hidden"
        >

            <div>

                <h2>
                    GAME OVER
                </h2>

                <p>
                    Score:
                    <strong id="finalScore">
                        0
                    </strong>
                </p>

            </div>

        </div>

    </div>



    <!-- =====================================================
         DIRECTION CONTROLS
    ====================================================== -->

    <div class="direction-controls">

        <button
            class="direction"
            data-dir="up"
        >
            ▲
        </button>


        <div class="direction-row">

            <button
                class="direction"
                data-dir="left"
            >
                ◀
            </button>


            <button
                class="direction center"
                type="button"
            >
                ●
            </button>


            <button
                class="direction"
                data-dir="right"
            >
                ▶
            </button>

        </div>


        <button
            class="direction"
            data-dir="down"
        >
            ▼
        </button>

    </div>



    <!-- =====================================================
         ACTION BUTTONS
    ====================================================== -->

    <div class="actions">

        <button
            id="start"
            class="action start"
            aria-label="Start"
        >
            ▶
        </button>


        <button
            id="pause"
            class="action pause"
            aria-label="Pause"
        >
            Ⅱ
        </button>


        <button
            id="restart"
            class="action restart"
            aria-label="Restart"
        >
            ↻
        </button>

    </div>

</div>



<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   UI
========================================================= */

const scoreText =
    document.getElementById("score");

const highScoreText =
    document.getElementById("highScore");

const finalScore =
    document.getElementById("finalScore");

const gameOverScreen =
    document.getElementById("gameOver");

const startButton =
    document.getElementById("start");

const pauseButton =
    document.getElementById("pause");

const restartButton =
    document.getElementById("restart");


/* =========================================================
   GAME GRID
========================================================= */

const COLUMNS = 20;
const ROWS = 25;


/* =========================================================
   GAME VARIABLES
========================================================= */

let snake;

let food;

let direction;

let nextDirection;

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "snakeHighScore"
        )
    ) || 0;

let running = false;

let paused = false;

let ended = false;

let interval;

let speed = 125;


/* =========================================================
   CANVAS SIZE
========================================================= */

let width = 0;
let height = 0;

let cellW = 0;
let cellH = 0;


/* =========================================================
   TOUCH
========================================================= */

let touchX = 0;
let touchY = 0;


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width = rect.width;
    height = rect.height;

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    cellW =
        width / COLUMNS;

    cellH =
        height / ROWS;

    draw();
}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    const x =
        Math.floor(COLUMNS / 2);

    const y =
        Math.floor(ROWS / 2);


    /*
     * IMPORTANT:
     * The snake starts long and horizontal.
     * This makes it impossible to miss.
     */

    snake = [

        { x: x,     y: y },

        { x: x - 1, y: y },

        { x: x - 2, y: y },

        { x: x - 3, y: y },

        { x: x - 4, y: y },

        { x: x - 5, y: y },

        { x: x - 6, y: y },

        { x: x - 7, y: y }

    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    speed = 125;

    running = false;

    paused = false;

    ended = false;


    clearInterval(interval);


    pauseButton.textContent = "Ⅱ";


    gameOverScreen.classList.add(
        "hidden"
    );


    createFood();

    updateScore();

    draw();
}


/* =========================================================
   START
========================================================= */

function startGame() {

    if (ended) {

        newGame();
    }


    if (running) {
        return;
    }


    running = true;

    paused = false;


    clearInterval(interval);


    interval =
        setInterval(
            update,
            speed
        );
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        ended
    ) {
        return;
    }


    paused =
        !paused;


    if (paused) {

        clearInterval(interval);

        pauseButton.textContent =
            "▶";

    } else {

        interval =
            setInterval(
                update,
                speed
            );

        pauseButton.textContent =
            "Ⅱ";
    }
}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    clearInterval(interval);

    newGame();

    startGame();
}


/* =========================================================
   UPDATE
========================================================= */

function update() {

    if (
        !running ||
        paused ||
        ended
    ) {
        return;
    }


    direction = {
        ...nextDirection
    };


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL COLLISION */

    if (
        head.x < 0 ||
        head.x >= COLUMNS ||
        head.y < 0 ||
        head.y >= ROWS
    ) {

        gameOver();

        return;
    }


    /*
     * SELF COLLISION
     */

    for (
        let i = 0;
        i < snake.length - 1;
        i++
    ) {

        if (
            snake[i].x === head.x &&
            snake[i].y === head.y
        ) {

            gameOver();

            return;
        }
    }


    snake.unshift(head);


    /*
     * FOOD
     */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score += 10;

        if (
            score > highScore
        ) {

            highScore = score;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );
        }


        createFood();


        /*
         * Increase speed slowly.
         */

        speed =
            Math.max(
                65,
                125 -
                Math.floor(score / 50) * 6
            );


        clearInterval(interval);


        interval =
            setInterval(
                update,
                speed
            );


        updateScore();

    } else {

        snake.pop();
    }


    draw();
}


/* =========================================================
   FOOD
========================================================= */

function createFood() {

    do {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    COLUMNS
                ),

            y:
                Math.floor(
                    Math.random() *
                    ROWS
                )

        };

    } while (
        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )
    );
}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {

    scoreText.textContent =
        score;

    highScoreText.textContent =
        highScore;
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    running = false;

    ended = true;

    clearInterval(interval);


    finalScore.textContent =
        score;


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================================
   CHANGE DIRECTION
========================================================= */

function setDirection(
    x,
    y
) {

    /*
     * Never allow an instant
     * 180-degree turn.
     */

    if (
        x === -direction.x &&
        y === -direction.y
    ) {
        return;
    }


    /*
     * Also prevent two direction
     * changes before the next move.
     */

    if (
        x === -nextDirection.x &&
        y === -nextDirection.y
    ) {
        return;
    }


    nextDirection = {
        x: x,
        y: y
    };
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            setDirection(
                0,
                -1
            );
        }


        else if (
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            setDirection(
                0,
                1
            );
        }


        else if (
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            setDirection(
                -1,
                0
            );
        }


        else if (
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            setDirection(
                1,
                0
            );
        }


        else if (
            key === " "
        ) {

            event.preventDefault();

            togglePause();
        }

    }
);


/* =========================================================
   DIRECTION BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".direction[data-dir]"
    )
    .forEach(button => {

        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();


                const dir =
                    button.dataset.dir;


                if (
                    dir === "up"
                ) {

                    setDirection(
                        0,
                        -1
                    );
                }


                else if (
                    dir === "down"
                ) {

                    setDirection(
                        0,
                        1
                    );
                }


                else if (
                    dir === "left"
                ) {

                    setDirection(
                        -1,
                        0
                    );
                }


                else if (
                    dir === "right"
                ) {

                    setDirection(
                        1,
                        0
                    );
                }

            }
        );
    });


/* =========================================================
   SWIPE CONTROLS
========================================================= */

canvas.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];

        touchX =
            touch.clientX;

        touchY =
            touch.clientY;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchX;

        const dy =
            touch.clientY -
            touchY;


        if (
            Math.abs(dx) < 25 &&
            Math.abs(dy) < 25
        ) {
            return;
        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            setDirection(
                dx > 0 ? 1 : -1,
                0
            );

        } else {

            setDirection(
                0,
                dy > 0 ? 1 : -1
            );
        }

    },
    {
        passive: true
    }
);


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#070c12";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   DRAW GRID
========================================================= */

function drawGrid() {

    ctx.strokeStyle =
        "rgba(33,217,255,.045)";

    ctx.lineWidth = .5;


    for (
        let x = 0;
        x <= COLUMNS;
        x++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x * cellW,
            0
        );

        ctx.lineTo(
            x * cellW,
            height
        );

        ctx.stroke();
    }


    for (
        let y = 0;
        y <= ROWS;
        y++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * cellH
        );

        ctx.lineTo(
            width,
            y * cellH
        );

        ctx.stroke();
    }
}


/* =========================================================
   DRAW FOOD
========================================================= */

function drawFood() {

    const x =
        food.x * cellW +
        cellW / 2;

    const y =
        food.y * cellH +
        cellH / 2;


    const r =
        Math.min(
            cellW,
            cellH
        ) * .28;


    ctx.save();


    ctx.fillStyle =
        "#ff4f9a";

    ctx.shadowColor =
        "#ff4f9a";

    ctx.shadowBlur = 13;


    /*
     * Apple-like food shape
     */

    ctx.beginPath();

    ctx.arc(
        x - r * .25,
        y,
        r * .75,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + r * .25,
        y,
        r * .75,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Stem
     */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "#8affb5";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - r * .65
    );

    ctx.lineTo(
        x + r * .15,
        y - r
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   DRAW SNAKE
========================================================= */

function drawSnake() {

    /*
     * The snake is NOT made from circles.
     *
     * We draw a continuous thick path.
     * This creates one connected body.
     */

    if (
        snake.length < 2
    ) {
        return;
    }


    const points =
        snake.map(
            segment => ({

                x:
                    segment.x *
                    cellW +
                    cellW / 2,

                y:
                    segment.y *
                    cellH +
                    cellH / 2

            })
        );


    const bodyWidth =
        Math.min(
            cellW,
            cellH
        ) * .64;


    /* -----------------------------------------------------
       OUTER BODY
    ----------------------------------------------------- */

    ctx.save();

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.strokeStyle =
        "#118a47";

    ctx.lineWidth =
        bodyWidth + 4;


    ctx.shadowColor =
        "rgba(57,232,121,.35)";

    ctx.shadowBlur = 7;


    ctx.beginPath();


    /*
     * Start at tail and travel
     * toward the head.
     */

    ctx.moveTo(
        points[points.length - 1].x,
        points[points.length - 1].y
    );


    for (
        let i =
            points.length - 2;

        i >= 0;

        i--
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );
    }


    ctx.stroke();


    /* -----------------------------------------------------
       MAIN BODY
    ----------------------------------------------------- */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "#31d976";

    ctx.lineWidth =
        bodyWidth;


    ctx.beginPath();

    ctx.moveTo(
        points[points.length - 1].x,
        points[points.length - 1].y
    );


    for (
        let i =
            points.length - 2;

        i >= 0;

        i--
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );
    }


    ctx.stroke();


    /* -----------------------------------------------------
       BODY HIGHLIGHT
    ----------------------------------------------------- */

    ctx.strokeStyle =
        "rgba(157,255,191,.32)";

    ctx.lineWidth =
        bodyWidth * .22;

    ctx.lineCap =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        points[points.length - 1].x,
        points[points.length - 1].y -
        bodyWidth * .08
    );


    for (
        let i =
            points.length - 2;

        i >= 0;

        i--
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y -
            bodyWidth * .08
        );
    }


    ctx.stroke();


    ctx.restore();


    /*
     * Draw tail separately.
     * This makes the end narrower.
     */

    drawTail(points);


    /*
     * Draw head on top.
     */

    drawHead(points[0]);
}


/* =========================================================
   TAIL
========================================================= */

function drawTail(points) {

    if (
        points.length < 2
    ) {
        return;
    }


    const tail =
        points[points.length - 1];

    const beforeTail =
        points[points.length - 2];


    const angle =
        Math.atan2(
            tail.y - beforeTail.y,
            tail.x - beforeTail.x
        );


    const length =
        Math.min(
            cellW,
            cellH
        ) * .55;


    const baseWidth =
        Math.min(
            cellW,
            cellH
        ) * .58;


    const tip = {

        x:
            tail.x +
            Math.cos(angle) *
            length,

        y:
            tail.y +
            Math.sin(angle) *
            length

    };


    ctx.save();


    ctx.fillStyle =
        "#31d976";


    ctx.beginPath();

    ctx.moveTo(
        tail.x +
        Math.cos(angle + Math.PI / 2) *
        baseWidth / 2,

        tail.y +
        Math.sin(angle + Math.PI / 2) *
        baseWidth / 2
    );


    ctx.lineTo(
        tail.x +
        Math.cos(angle - Math.PI / 2) *
        baseWidth / 2,

        tail.y +
        Math.sin(angle - Math.PI / 2) *
        baseWidth / 2
    );


    ctx.lineTo(
        tip.x,
        tip.y
    );


    ctx.closePath();

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   HEAD
========================================================= */

function drawHead(point) {

    const radius =
        Math.min(
            cellW,
            cellH
        ) * .48;


    const x =
        point.x;

    const y =
        point.y;


    /*
     * Head extends slightly forward
     * depending on direction.
     */

    const forward =
        Math.min(
            cellW,
            cellH
        ) * .13;


    const hx =
        x +
        direction.x *
        forward;

    const hy =
        y +
        direction.y *
        forward;


    ctx.save();


    /*
     * Head gradient.
     */

    const gradient =
        ctx.createRadialGradient(
            hx - radius * .3,
            hy - radius * .35,
            radius * .1,

            hx,
            hy,
            radius
        );


    gradient.addColorStop(
        0,
        "#baffd0"
    );

    gradient.addColorStop(
        .4,
        "#55ed8a"
    );

    gradient.addColorStop(
        1,
        "#13914b"
    );


    ctx.fillStyle =
        gradient;


    ctx.shadowColor =
        "rgba(57,232,121,.55)";

    ctx.shadowBlur = 9;


    ctx.beginPath();

    ctx.ellipse(
        hx,
        hy,
        radius * 1.05,
        radius * .88,
        Math.atan2(
            direction.y,
            direction.x
        ),
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    drawEyes(
        hx,
        hy,
        radius
    );


    /*
     * Small tongue.
     */

    drawTongue(
        hx,
        hy,
        radius
    );


    ctx.restore();
}


/* =========================================================
   EYES
========================================================= */

function drawEyes(
    x,
    y,
    radius
) {

    let sideX =
        -direction.y;

    let sideY =
        direction.x;


    const eyeForward =
        radius * .38;

    const eyeSide =
        radius * .38;


    const eyes = [

        {
            x:
                x +
                direction.x *
                eyeForward +
                sideX *
                eyeSide,

            y:
                y +
                direction.y *
                eyeForward +
                sideY *
                eyeSide
        },

        {
            x:
                x +
                direction.x *
                eyeForward -
                sideX *
                eyeSide,

            y:
                y +
                direction.y *
                eyeForward -
                sideY *
                eyeSide
        }

    ];


    eyes.forEach(
        eye => {

            ctx.fillStyle =
                "#ffffff";


            ctx.beginPath();

            ctx.arc(
                eye.x,
                eye.y,
                radius * .19,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "#111111";


            ctx.beginPath();

            ctx.arc(
                eye.x +
                direction.x *
                radius *
                .04,

                eye.y +
                direction.y *
                radius *
                .04,

                radius * .095,

                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    );
}


/* =========================================================
   TONGUE
========================================================= */

function drawTongue(
    x,
    y,
    radius
) {

    const startX =
        x +
        direction.x *
        radius *
        .92;

    const startY =
        y +
        direction.y *
        radius *
        .92;


    const endX =
        x +
        direction.x *
        radius *
        1.35;

    const endY =
        y +
        direction.y *
        radius *
        1.35;


    const sideX =
        -direction.y;

    const sideY =
        direction.x;


    ctx.strokeStyle =
        "#ff4f9a";

    ctx.lineWidth = 1.5;

    ctx.lineCap =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        startX,
        startY
    );

    ctx.lineTo(
        endX,
        endY
    );

    ctx.stroke();


    /*
     * Forked tongue.
     */

    ctx.beginPath();

    ctx.moveTo(
        endX,
        endY
    );

    ctx.lineTo(
        endX +
        sideX *
        radius *
        .22,

        endY +
        sideY *
        radius *
        .22
    );

    ctx.moveTo(
        endX,
        endY
    );

    ctx.lineTo(
        endX -
        sideX *
        radius *
        .22,

        endY -
        sideY *
        radius *
        .22
    );

    ctx.stroke();
}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

    if (
        width <= 0 ||
        height <= 0
    ) {
        return;
    }


    drawBackground();

    drawGrid();

    drawFood();

    drawSnake();
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);

pauseButton.addEventListener(
    "click",
    togglePause
);

restartButton.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   INITIAL LOAD
========================================================= */

newGame();

resize();

</script>
